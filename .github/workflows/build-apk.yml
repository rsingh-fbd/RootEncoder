name: Build RootEncoder APK

# Sirf manual click se chalega – auto nahi
on:
  workflow_dispatch:

# Push aur tag permission (403 error fix)
permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK as Artifact (Main Result)
        uses: actions/upload-artifact@v4
        with:
          name: RootEncoder-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Optional - Create Tag (Safe with Git Config)
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "actions@github.com"
          TAG_NAME="v1.0-$(date +'%Y%m%d')"
          git tag -a $TAG_NAME -m "Auto built APK on $(date)"
          git push origin $TAG_NAME || echo "Tag already exists or push skipped"